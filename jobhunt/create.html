<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pilot AI — turn your unemployment into interviews</title>
  <meta name="description" content="Describe the job you deserve. Pilot AI turns it into a hunt.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='18' y='18' width='64' height='64' rx='18' transform='rotate(45 50 50)' fill='%230D0D0D'/></svg>">
  <style>
    :root {
      --bg: #F2F1EF;
      --panel: #FAFAF9;
      --card: #FFFFFF;
      --ink: #141414;
      --ink-2: #5C5C5C;
      --muted: #9A9A98;
      --line: #E9E8E6;
      --blue: #3D7BFA;
      --blue-soft: #E7EFFE;
      --dark: #2B2B2B;
      --eye: #52E5B4;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
      --r-xl: 30px;
      --r-lg: 22px;
      --shadow-soft: 0 1px 2px rgba(20, 20, 20, 0.03), 0 10px 30px -12px rgba(20, 20, 20, 0.1);
      --shadow-pop: 0 6px 16px rgba(20, 20, 20, 0.08), 0 24px 60px -20px rgba(20, 20, 20, 0.2);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--ink);
      min-height: 100dvh;
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      display: flex;
      justify-content: center;
    }
    button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 8px; }

    .phone {
      width: min(560px, 100%);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 18px 18px 0;
      position: relative;
    }

    /* ---- Top chrome ---- */
    .topbar { display: flex; justify-content: space-between; align-items: center; }
    .rnd {
      width: 52px; height: 52px;
      border-radius: 18px;
      background: #8B8681;
      color: #fff;
      display: grid; place-items: center;
      transition: transform 0.15s ease-out, background 0.15s;
    }
    .rnd:hover { background: #6F6A64; transform: translateY(-1px); }
    .rnd:active { transform: translateY(1px); }

    /* ---- Hero panel ---- */
    .stage { flex: 1; display: flex; flex-direction: column; justify-content: center; padding-bottom: 16px; }
    .hero-card {
      position: relative;
      background: var(--panel);
      border-radius: var(--r-xl) var(--r-xl) 0 0;
      padding: 130px 26px 30px;
      box-shadow: var(--shadow-soft);
    }
    .hero-card h1 {
      font-size: clamp(23px, 6vw, 28px);
      font-weight: 400;
      letter-spacing: -0.02em;
      max-width: 17ch;
    }
    .hero-card h1 b { font-weight: 700; }

    /* ---- Robot ---- */
    .bot {
      position: absolute;
      right: 26px;
      bottom: -46px;
      width: 132px;
      z-index: 2;
      cursor: pointer;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      animation: bob 4.5s ease-in-out infinite;
    }
    .bot:hover { transform: translateY(-4px) rotate(-2deg); }
    @keyframes bob { 0%, 100% { translate: 0 0; } 50% { translate: 0 -5px; } }
    .bot .eye { animation: blink 4s infinite; transform-origin: center; }
    @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.12); } }
    .bot.excited .eye-shape { display: none; }
    .bot .eye-rupee { display: none; font: 700 15px var(--font); fill: var(--eye); }
    .bot.excited .eye-rupee { display: block; }

    /* ---- Prompt card ---- */
    .prompt-card {
      position: relative;
      background: var(--card);
      border-radius: var(--r-lg);
      box-shadow: var(--shadow-pop);
      padding: 20px 20px 14px;
      z-index: 1;
    }
    .prompt-input {
      width: 100%;
      border: none; outline: none;
      font: inherit; font-size: 16.5px;
      color: var(--ink);
      padding: 2px 0 26px;
      background: none;
    }
    .prompt-input::placeholder { color: var(--muted); }
    .prompt-tools { display: flex; align-items: center; gap: 8px; }
    .t-attach {
      width: 40px; height: 40px;
      border-radius: 50%;
      border: 1px solid var(--line);
      display: grid; place-items: center;
      color: var(--ink-2);
      flex-shrink: 0;
    }
    .t-attach:hover { background: var(--panel); }
    .t-pill {
      display: inline-flex; align-items: center; gap: 7px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 9px 15px;
      font-size: 13.5px; font-weight: 500;
      color: var(--ink);
      white-space: nowrap;
    }
    .t-pill:hover { background: var(--panel); }
    .t-pill .car { font-size: 9px; color: var(--muted); }
    .t-pill.blue { background: var(--blue-soft); border-color: transparent; color: var(--blue); }
    .t-ai {
      margin-left: auto;
      display: inline-flex; align-items: center; gap: 7px;
      font-size: 13.5px; font-weight: 500;
      padding: 9px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .t-ai:hover { background: var(--panel); }
    .t-voice {
      width: 58px; height: 40px;
      border-radius: 999px;
      background: var(--dark);
      color: #fff;
      display: grid; place-items: center;
      flex-shrink: 0;
      transition: transform 0.15s;
    }
    .t-voice:hover { transform: translateY(-1px); }
    .t-voice:active { transform: translateY(1px); }

    /* ---- Category chips ---- */
    .cats {
      display: flex; gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 18px 2px 4px;
      mask-image: linear-gradient(to right, black calc(100% - 24px), transparent);
      -webkit-mask-image: linear-gradient(to right, black calc(100% - 24px), transparent);
    }
    .cats::-webkit-scrollbar { display: none; }
    .cat {
      display: inline-flex; align-items: center; gap: 8px;
      border: 1px solid var(--line);
      background: var(--card);
      border-radius: 999px;
      padding: 10px 17px;
      font-size: 13.5px; font-weight: 500;
      color: var(--ink-2);
      white-space: nowrap;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .cat[aria-selected="true"] { background: #E8E7E4; border-color: transparent; color: var(--ink); }
    .cat:hover { border-color: #D5D4D1; }

    /* ---- Suggestions ---- */
    .sugs { display: flex; flex-direction: column; padding: 6px 0 24px; }
    .sug {
      display: flex; align-items: center; gap: 13px;
      text-align: left;
      padding: 15px 12px;
      border-radius: 14px;
      font-size: 14.5px;
      color: var(--ink);
      transition: background 0.14s;
      animation: sug-in 0.35s ease-out both;
    }
    .sug:nth-child(2) { animation-delay: 0.05s; }
    .sug:nth-child(3) { animation-delay: 0.1s; }
    .sug:nth-child(4) { animation-delay: 0.15s; }
    @keyframes sug-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .sug:hover { background: #EBEAE7; }
    .sug .ic {
      width: 22px; height: 22px;
      display: grid; place-items: center;
      color: var(--ink-2);
      flex-shrink: 0;
      font-size: 14px;
    }
    .sug .tx { flex: 1; min-width: 0; }
    .sug .go { color: var(--ink-2); opacity: 0; transition: opacity 0.14s, transform 0.14s; transform: translateX(-4px); }
    .sug:hover .go { opacity: 1; transform: none; }

    /* ---- Bottom hint ---- */
    .swipe {
      position: sticky; bottom: 0;
      margin: auto -18px 0;
      padding: 46px 0 16px;
      text-align: center;
      background: linear-gradient(to top, rgba(43, 43, 43, 0.5), transparent);
      color: #fff;
      font-size: 17px;
      display: block;
      width: calc(100% + 36px);
    }
    .swipe .bar {
      display: block;
      width: 64px; height: 5px;
      background: #fff;
      border-radius: 999px;
      margin: 12px auto 0;
      opacity: 0.9;
    }
    .swipe:hover { color: #fff; }

    @media (max-width: 480px) {
      .t-pill { padding: 8px 12px; font-size: 12.5px; }
      .t-ai { padding: 8px 8px; }
      .t-ai .ai-label { display: none; }
      .t-voice { width: 48px; }
      .bot { width: 112px; right: 18px; bottom: -42px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <div class="phone">
    <!-- Top chrome -->
    <header class="topbar">
      <a class="rnd" href="index.html" aria-label="Back to Job Pilot">
        <svg width="17" height="17" viewBox="0 0 17 17" fill="none"><path d="M11 2L4.5 8.5 11 15" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <button class="rnd" id="moreBtn" aria-label="More options">
        <svg width="18" height="4" viewBox="0 0 18 4" fill="none"><circle cx="2" cy="2" r="1.8" fill="currentColor"/><circle cx="9" cy="2" r="1.8" fill="currentColor"/><circle cx="16" cy="2" r="1.8" fill="currentColor"/></svg>
      </button>
    </header>

    <div class="stage">
      <!-- Hero panel + robot -->
      <div class="hero-card">
        <h1>Turn your <b>unemployment</b> into <b>interviews</b></h1>

        <svg class="bot" id="bot" viewBox="0 0 132 120" aria-label="Pilot bot — click for encouragement" role="img">
          <defs>
            <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#FFFFFF"/>
              <stop offset="1" stop-color="#E4E1DC"/>
            </linearGradient>
            <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#3A3F46"/>
              <stop offset="1" stop-color="#14161A"/>
            </linearGradient>
          </defs>
          <!-- antenna -->
          <line x1="88" y1="14" x2="88" y2="4" stroke="#C9C5BF" stroke-width="3" stroke-linecap="round"/>
          <circle cx="88" cy="4" r="3.4" fill="#C9C5BF"/>
          <!-- head -->
          <rect x="30" y="12" width="94" height="58" rx="26" fill="url(#shell)"/>
          <rect x="30" y="12" width="94" height="58" rx="26" fill="none" stroke="rgba(20,20,20,0.05)"/>
          <!-- visor -->
          <rect x="40" y="22" width="62" height="38" rx="17" fill="url(#visor)"/>
          <!-- eyes -->
          <g class="eye">
            <rect class="eye-shape" x="52" y="33" width="12" height="16" rx="6" fill="var(--eye)"/>
            <text class="eye-rupee" x="52" y="47">₹</text>
          </g>
          <g class="eye" style="animation-delay:0.08s">
            <rect class="eye-shape" x="76" y="33" width="12" height="16" rx="6" fill="var(--eye)"/>
            <text class="eye-rupee" x="76" y="47">₹</text>
          </g>
          <!-- neck -->
          <rect x="66" y="70" width="14" height="14" rx="5" fill="#D9D5CF"/>
          <!-- arms hanging over the card edge -->
          <rect x="44" y="84" width="12" height="34" rx="6" fill="url(#shell)"/>
          <rect x="90" y="84" width="12" height="34" rx="6" fill="url(#shell)"/>
        </svg>
      </div>

      <!-- Prompt card -->
      <div class="prompt-card">
        <form id="promptForm">
          <input class="prompt-input" id="promptInput" type="text"
                 placeholder="What do you want to hunt?" autocomplete="off"
                 aria-label="Describe the job you want">
          <div class="prompt-tools">
            <button class="t-attach" type="button" id="attachBtn" title="Attach resume v14" aria-label="Attach resume">
              <svg width="16" height="17" viewBox="0 0 16 17" fill="none"><path d="M14 7.5l-5.9 6a3.6 3.6 0 01-5.2-5l6.5-6.6a2.4 2.4 0 013.5 3.4L6.6 11a1.2 1.2 0 01-1.8-1.7L10 4.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button class="t-pill" type="button" id="styleBtn">
              <span id="styleLabel">Hunt Style</span> <span class="car">▼</span>
            </button>
            <button class="t-pill blue" type="button" id="ideasBtn">💡 Ideas</button>
            <button class="t-ai" type="button" id="aiBtn">✦ <span class="ai-label">Pilot AI</span> <span class="car" style="font-size:9px;color:var(--muted)">▼</span></button>
            <button class="t-voice" type="button" id="voiceBtn" aria-label="Voice input">
              <svg width="20" height="14" viewBox="0 0 20 14" fill="none"><path d="M2 5v4M6 2v10M10 4.5v5M14 1v12M18 5.5v3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            </button>
          </div>
        </form>
      </div>

      <!-- Category chips -->
      <div class="cats" role="tablist" aria-label="Suggestion categories" id="cats"></div>

      <!-- Suggestions -->
      <div class="sugs" id="sugs" aria-live="polite"></div>
    </div>

    <!-- Bottom hint -->
    <a class="swipe" href="app.html">
      Swipe up to explore roles
      <span class="bar"></span>
    </a>
  </div>

  <script>
    const $ = s => document.querySelector(s);
    const pick = a => a[Math.floor(Math.random() * a.length)];

    /* ---- Suggestion sets per category ---- */
    const CATS = [
      { key: 'suggested', icon: '💡', label: 'Suggested', sugs: [
        ['▦', 'A senior frontend role that pays like it respects me.'],
        ['⏳', 'A modern design-engineer job with an actual design system.'],
        ['☺', 'A recruiter who replies within this fiscal year.'],
      ]},
      { key: 'roles', icon: '▤', label: 'Roles', sugs: [
        ['⌘', 'Design Engineer, ₹50L+, founders who answer email.'],
        ['▦', 'Staff Frontend, no jQuery, no exceptions.'],
        ['✎', 'Anything where “full-stack” doesn’t secretly mean “also DevOps”.'],
      ]},
      { key: 'remote', icon: '🏝', label: 'Remote', sugs: [
        ['🏝', 'Remote only, above 40L, IST-friendly standups.'],
        ['🛋', 'A job I can do without ever seeing Gurugram again.'],
        ['🌏', 'Remote-first, not “remote until the lease ends”.'],
      ]},
      { key: 'flags', icon: '🚩', label: 'Red flags', sugs: [
        ['🚩', 'Show me everything, red flags included. I can take it.'],
        ['🫠', 'No “we’re a family” companies. My family is enough.'],
        ['🎸', 'Zero rockstar/ninja titles. This is a workplace.'],
      ]},
      { key: 'deep', icon: '🔎', label: 'Deep hunt', sugs: [
        ['🔎', 'Run a deep hunt across all 9 sources overnight.'],
        ['🦴', 'Carbon-date every listing and bury the fossils.'],
        ['📊', 'Deep hunt with real salaries from levels.fyi, no “competitive”.'],
      ]},
    ];

    const catsEl = $('#cats'), sugsEl = $('#sugs');
    function renderCats(activeKey) {
      catsEl.innerHTML = CATS.map(c =>
        `<button class="cat" role="tab" aria-selected="${c.key === activeKey}" data-k="${c.key}">${c.icon} ${c.label}</button>`).join('');
      const cat = CATS.find(c => c.key === activeKey);
      sugsEl.innerHTML = cat.sugs.map(([ic, tx]) =>
        `<button class="sug" data-q="${tx.replace(/"/g, '&quot;')}" ${cat.key === 'deep' ? 'data-deep="1"' : ''}>
          <span class="ic">${ic}</span><span class="tx">${tx}</span>
          <span class="go">→</span>
        </button>`).join('');
    }
    catsEl.addEventListener('click', e => {
      const c = e.target.closest('.cat');
      if (c) renderCats(c.dataset.k);
    });
    renderCats('suggested');

    /* ---- Launch: everything funnels into the app ---- */
    function launch(q, deep) {
      const p = new URLSearchParams();
      if (q) p.set('q', q);
      if (deep) p.set('deep', '1');
      location.href = 'app.html' + (p.toString() ? '?' + p.toString() : '');
    }
    sugsEl.addEventListener('click', e => {
      const s = e.target.closest('.sug');
      if (s) launch(s.dataset.q, s.dataset.deep === '1');
    });
    $('#promptForm').addEventListener('submit', e => {
      e.preventDefault();
      const v = $('#promptInput').value.trim();
      launch(v || 'Find me frontend roles', false);
    });

    /* ---- Toys ---- */
    const toastQueue = msg => { /* minimal inline toast */
      let t = $('#tinyToast');
      if (!t) {
        t = document.createElement('div');
        t.id = 'tinyToast';
        t.style.cssText = 'position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:#141414;color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;z-index:50;max-width:88vw;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.25);transition:opacity .25s;opacity:0;pointer-events:none';
        document.body.appendChild(t);
      }
      t.textContent = msg;
      t.style.opacity = '1';
      clearTimeout(t._h);
      t._h = setTimeout(() => { t.style.opacity = '0'; }, 3200);
    };

    const STYLES = ['Hunt Style', 'Minimal desperation', 'Corporate cosplay', 'Full goblin mode', 'Rent is due'];
    let styleIx = 0;
    $('#styleBtn').addEventListener('click', () => {
      styleIx = (styleIx + 1) % STYLES.length;
      $('#styleLabel').textContent = STYLES[styleIx];
      if (styleIx === 4) toastQueue('Rent mode: standards lowered by exactly 30%. Godspeed.');
    });
    $('#ideasBtn').addEventListener('click', () => {
      const cat = CATS[Math.floor(Math.random() * CATS.length)];
      renderCats(cat.key);
      toastQueue('Ideas refreshed. The market, unfortunately, is the same.');
    });
    $('#aiBtn').addEventListener('click', () => toastQueue('Pilot AI v5 — trained on 42 boards and one million rejection emails.'));
    $('#voiceBtn').addEventListener('click', () => toastQueue('Voice mode: I heard a sigh. Searching accordingly…'));
    $('#attachBtn').addEventListener('click', () => toastQueue('resume_v14_FINAL_final(2).pdf attached. Bold of you.'));
    $('#moreBtn').addEventListener('click', () => toastQueue('There is no more. This is everything we have.'));

    const bot = $('#bot');
    bot.addEventListener('click', () => {
      bot.classList.add('excited');
      toastQueue(pick([
        'Beep. You are statistically hireable. 🤖',
        'I believe in you. I am programmed to, but still.',
        'Salary detected in your future. Probability: rising.',
      ]));
      setTimeout(() => bot.classList.remove('excited'), 1600);
    });

    document.addEventListener('visibilitychange', () => {
      document.title = document.hidden ? 'The robot misses you.' : 'Pilot AI — turn your unemployment into interviews';
    });
    console.log('%c◆ Pilot AI — describe the job you deserve.', 'font-weight:600');
  </script>
</body>
</html>

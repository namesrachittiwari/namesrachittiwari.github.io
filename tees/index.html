<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pokie Tees — one sentence, one tee</title>
<meta name="description" content="One-line tees: black cotton, white ink, sentences you can wear. UPI payment, hostel hand-delivery or shipped.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M9.5 3.4 C9.5 5.5 14.5 5.5 14.5 3.4 L18 4.5 L21.6 8.6 L18.4 11.2 L17.3 10.2 L17.3 20.6 L6.7 20.6 L6.7 10.2 L5.6 11.2 L2.4 8.6 L6 4.5 Z' fill='%23EB6BA8'/><rect x='8.7' y='12.4' width='6.6' height='2.4' rx='1.2' fill='%23fff'/></svg>">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* ===== Pokie Tees v7 — design tokens are the handoff's own (bg #000, not --black) ===== */
html, body { margin: 0; padding: 0; background: #000000; }
body { font-family: 'Poppins', system-ui, sans-serif; -webkit-font-smoothing: antialiased; color: #ffffff; }
* { box-sizing: border-box; }
a { color: #ffffff; text-decoration: none; }
a:hover { color: #EB6BA8; }
::selection { background: #EB6BA8; color: #070707; }
input, textarea, button { font-family: inherit; }
button { -webkit-tap-highlight-color: transparent; }

@keyframes screenIn { 0% { opacity: 0; transform: translateY(10px); } 100% { opacity: 1; transform: translateY(0); } }
@keyframes fadeIn   { 0% { opacity: 0; } 100% { opacity: 1; } }
@keyframes slideIn  { 0% { transform: translateX(100%); } 100% { transform: translateX(0); } }
@keyframes popIn    { 0% { opacity: 0; transform: scale(.96); } 100% { opacity: 1; transform: scale(1); } }
@keyframes levitate { 0%, 100% { transform: translateY(0) rotate(0deg); } 30% { transform: translateY(-14px) rotate(-.8deg); } 65% { transform: translateY(-5px) rotate(.6deg); } }
@keyframes teeFront { 0%, 49.9% { opacity: 1; } 50%, 99.9% { opacity: 0; } 100% { opacity: 1; } }
@keyframes teeBack  { 0%, 49.9% { opacity: 0; } 50%, 99.9% { opacity: 1; } 100% { opacity: 0; } }

/* ===== nav ===== */
.nav { position: fixed; top: 0; left: 0; right: 0; z-index: 50; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 22px clamp(18px, 4vw, 56px); background: rgba(0,0,0,.9); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.brand { font-size: 20px; font-weight: 600; letter-spacing: -.02em; white-space: nowrap; color: #ffffff; background: transparent; border: none; cursor: pointer; padding: 0; font-family: inherit; }
.nav-right { display: flex; align-items: center; gap: clamp(18px, 3vw, 40px); }
.nav-link { font-size: 14.5px; background: transparent; border: none; cursor: pointer; padding: 0; transition: color .2s ease; color: #9A9A9A; }
.nav-link:hover { color: #EB6BA8; }
.nav-link.active { color: #ffffff; }
.cart-btn { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; cursor: pointer; color: #070707; background: #EB6BA8; border: none; padding: 9px 16px; border-radius: 999px; transition: background .2s ease; }
.cart-btn:hover { background: #ffffff; }
.cart-count { min-width: 18px; height: 18px; border-radius: 999px; background: rgba(7,7,7,.22); display: grid; place-items: center; font-size: 11px; font-variant-numeric: tabular-nums; padding: 0 5px; }

/* ===== strips (availability warning / resume) ===== */
.strip { display: none; position: relative; z-index: 40; margin-top: 66px; padding: 10px clamp(18px, 4vw, 56px); font-size: 12.5px; color: #9A9A9A; background: #0B0B0B; border-bottom: 1px solid rgba(255,255,255,.08); }
.strip.on { display: block; }
.strip.on ~ .screen { padding-top: 60px; }
.strip .btn-mini { font-size: 12px; font-weight: 500; color: #070707; background: #EB6BA8; border: none; border-radius: 999px; padding: 6px 14px; cursor: pointer; margin-left: 10px; }
.strip .btn-ghost-mini { font-size: 12px; color: #9A9A9A; background: transparent; border: none; cursor: pointer; margin-left: 6px; }
.strip .btn-ghost-mini:hover { color: #ffffff; }

/* ===== tee visual (shared: tiles, detail, popup, studio, cart) ===== */
.tee-visual { position: relative; overflow: hidden; }
.tee-visual img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.tee-visual.contain img { object-fit: contain; }
.tee-visual .back { opacity: 0; }
.tee-visual.flip .front, .tee-visual.flip .zone { animation: teeFront 3.6s linear infinite; animation-delay: var(--fd, 0s); }
.tee-visual.flip .back { animation: teeBack 3.6s linear infinite; animation-delay: var(--fd, 0s); }
.zone { position: absolute; left: 33.5%; right: 33.5%; top: 34%; height: 28%; container-type: inline-size; display: grid; place-items: center; overflow: hidden; }
.print { text-align: center; font-family: 'Bebas Neue', 'Poppins', sans-serif; font-weight: 400; line-height: 1.04; letter-spacing: .035em; color: #f6f6f6; text-shadow: 0 0 9px rgba(255,255,255,.2); text-wrap: balance; white-space: pre-line; }

/* ===== screens ===== */
.screen { animation: screenIn .45s cubic-bezier(.16,1,.3,1) both; }

/* shop */
.shop { display: flex; gap: clamp(24px, 4vw, 64px); padding: 120px clamp(18px, 4vw, 56px) 90px; max-width: 1560px; margin: 0 auto; }
.side { flex: none; width: 200px; position: sticky; top: 130px; align-self: flex-start; display: flex; flex-direction: column; gap: 15px; }
.side-link { font-size: 14px; letter-spacing: .04em; text-transform: uppercase; text-align: left; background: transparent; border: none; cursor: pointer; padding: 0; transition: color .2s ease; color: #9A9A9A; }
.side-link:hover { color: #ffffff; }
.side-link.active { color: #ffffff; }
.side-link.all.active { color: #EB6BA8; }
.side-link.print-yours:hover { color: #EB6BA8; }
.side-gap { height: 18px; flex: none; }
.grid { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: clamp(28px, 3vw, 52px) clamp(18px, 2vw, 36px); }
.tile { display: flex; flex-direction: column; gap: 4px; background: transparent; border: none; cursor: pointer; padding: 0; transition: transform .3s cubic-bezier(.16,1,.3,1); }
.tile:hover { transform: translateY(-4px); }
.tile .tee-visual { width: 100%; aspect-ratio: 1 / 1; }
.tile-name { font-size: 13.5px; letter-spacing: .06em; text-transform: uppercase; color: #ffffff; text-align: center; width: 100%; }
.tile-price { font-size: 12.5px; letter-spacing: .06em; text-transform: uppercase; color: #9A9A9A; text-align: center; width: 100%; }

/* archive */
.arch { padding: 130px clamp(18px, 4vw, 56px) 90px; max-width: 1560px; margin: 0 auto; }
.arch-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.arch-head .l { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: #9A9A9A; }
.arch-head .r { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: #555555; }
.arch-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: clamp(16px, 2vw, 34px); margin-top: 44px; }
.arch-tile { position: relative; aspect-ratio: 1 / 1; overflow: hidden; background: transparent; border: none; cursor: pointer; padding: 0; transition: transform .3s cubic-bezier(.16,1,.3,1); }
.arch-tile:hover { transform: scale(1.05); }
.arch-tile .tee-visual { position: absolute; inset: 0; }
.arch-tile .print { text-shadow: none; }

/* archive retro popup */
.pop-back { position: fixed; inset: 0; z-index: 70; background: rgba(0,0,0,.62); display: grid; place-items: center; padding: 20px; animation: fadeIn .2s ease both; }
.pop-win { width: min(720px, 94vw); background: #c9c9c9; border: 2px solid; border-color: #ffffff #6b6b6b #6b6b6b #ffffff; box-shadow: 0 30px 80px rgba(0,0,0,.7); animation: popIn .25s cubic-bezier(.16,1,.3,1) both; }
.pop-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 7px 8px 7px 14px; background: #0014A8; }
.pop-title { font-family: ui-monospace, monospace; font-size: 14px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: #ffffff; }
.pop-x { width: 24px; height: 22px; display: grid; place-items: center; cursor: pointer; font-size: 13px; font-weight: 500; color: #000000; background: #c9c9c9; border: 2px solid; border-color: #ffffff #6b6b6b #6b6b6b #ffffff; padding: 0; line-height: 1; }
.pop-body { padding: 28px 30px 30px; background: #cfcfcf; border-top: 1px solid #9a9a9a; }
.pop-screen { position: relative; height: min(46vh, 380px); background: #060606; border: 2px solid; border-color: #6b6b6b #ffffff #ffffff #6b6b6b; overflow: hidden; }
.pop-screen .tee-visual { position: absolute; inset: 12px; }
.pop-cap { font-family: ui-monospace, monospace; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: #111111; text-align: center; margin: 22px 0 0; }
.pop-origin { font-size: 12px; line-height: 1.6; color: #4a4a4a; text-align: center; margin: 10px auto 0; max-width: 52ch; }

/* product detail overlay */
.detail { position: fixed; inset: 0; z-index: 60; background: #000000; overflow: auto; animation: fadeIn .25s ease both; }
.d-close { position: fixed; top: 24px; right: clamp(18px, 3vw, 44px); z-index: 5; width: 40px; height: 40px; display: grid; place-items: center; font-size: 16px; color: #ffffff; background: transparent; border: none; cursor: pointer; transition: color .2s ease; }
.d-close:hover { color: #EB6BA8; }
.d-cart { position: fixed; top: 25px; right: calc(clamp(18px, 3vw, 44px) + 52px); z-index: 5; }
.d-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(380px, 560px); min-height: 100vh; }
.d-stage { position: relative; display: grid; place-items: center; padding: 90px 30px 60px; border-right: 1px solid rgba(255,255,255,.12); }
.d-float { position: relative; width: min(88%, 640px); aspect-ratio: 1 / 1; animation: levitate 6.5s ease-in-out infinite; }
.d-float .tee-visual { position: absolute; inset: 0; }
.d-float .print { text-shadow: 0 0 9px rgba(255,255,255,.22); }
.d-info { padding: 100px clamp(26px, 4vw, 60px) 70px; display: flex; flex-direction: column; animation: screenIn .4s cubic-bezier(.16,1,.3,1) .1s both; }
.d-name { font-size: 20px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; margin: 0; }
.d-price { font-size: 16px; color: #9A9A9A; margin-top: 10px; }
.d-desc { font-size: 16px; line-height: 1.7; color: #d6d6d6; margin: 42px 0 0; max-width: 46ch; text-wrap: pretty; }
.d-sizes { display: flex; flex-wrap: wrap; gap: clamp(14px, 2vw, 28px); margin-top: 52px; }
.size-btn { font-size: 15px; letter-spacing: .06em; background: transparent; border: none; cursor: pointer; padding: 4px 2px; transition: color .2s ease; color: #9A9A9A; border-bottom: 2px solid transparent; }
.size-btn:hover { color: #ffffff; }
.size-btn.sel { color: #ffffff; border-bottom-color: #EB6BA8; }
.size-btn.dead { color: #555555; text-decoration: line-through; cursor: default; }
.size-btn.dead:hover { color: #555555; }
.d-cta-row { margin-top: 34px; }
.d-cta { font-size: 14.5px; font-weight: 500; cursor: pointer; color: #000000; background: #ffffff; border: none; padding: 15px 34px; border-radius: 999px; transition: background .2s ease; }
.d-cta:hover { background: #EB6BA8; }
.d-cta.dead { cursor: default; background: rgba(255,255,255,.14); color: #9A9A9A; }
.d-cta.dead:hover { background: rgba(255,255,255,.14); }
.accs { margin-top: 70px; border-top: 1px solid rgba(255,255,255,.18); }
.acc-btn { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 22px 2px; background: transparent; border: none; cursor: pointer; color: #ffffff; }
.acc-title { font-size: 19px; font-weight: 500; letter-spacing: -.01em; }
.acc-sign { font-size: 22px; font-weight: 300; line-height: 1; }
.acc-body { font-size: 14.5px; line-height: 1.7; color: #9A9A9A; margin: 0 0 24px; max-width: 46ch; }
.acc-rule { border-top: 1px solid rgba(255,255,255,.18); }

/* studio */
.studio { padding: 130px clamp(18px, 4vw, 56px) 90px; max-width: 1140px; margin: 0 auto; }
.st-h { font-size: clamp(24px, 3.4vw, 38px); font-weight: 600; letter-spacing: -.03em; line-height: 1.05; margin: 0; }
.st-sub { font-size: 13.5px; color: #9A9A9A; margin: 8px 0 0; }
.st-grid { display: grid; grid-template-columns: minmax(300px, 1fr) minmax(320px, 440px); gap: clamp(28px, 4vw, 70px); margin-top: 40px; align-items: center; }
.st-preview { position: relative; aspect-ratio: 1 / 1; }
.st-preview > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.print-area { position: absolute; left: 33.5%; right: 33.5%; top: 34%; height: 28%; container-type: inline-size; border: 1.5px dashed rgba(255,255,255,.4); border-radius: 4px; }
.print-area .tag { position: absolute; top: -22px; left: 0; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: #9A9A9A; }
.print-area .inset { position: absolute; inset: 6px; display: grid; place-items: center; overflow: hidden; }
.print-area .print { text-shadow: none; }
.st-side { display: flex; flex-direction: column; gap: 18px; }
.st-text { width: 100%; resize: none; font-size: 16px; line-height: 1.5; color: #ffffff; background: transparent; border: 1px solid rgba(255,255,255,.25); border-radius: 12px; padding: 16px; outline: none; }
.st-notes { display: flex; justify-content: space-between; gap: 12px; }
.st-note { font-size: 12px; color: #9A9A9A; }
.st-count { font-size: 12px; color: #555555; font-variant-numeric: tabular-nums; }
.st-sizes { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 6px; }
.st-size { font-size: 14px; letter-spacing: .04em; background: transparent; border: none; cursor: pointer; padding: 3px 1px; transition: color .2s ease; color: #9A9A9A; border-bottom: 2px solid transparent; }
.st-size:hover { color: #ffffff; }
.st-size.sel { color: #ffffff; border-bottom-color: #EB6BA8; }
.st-cta { font-size: 14.5px; font-weight: 500; cursor: pointer; color: #070707; background: #ffffff; border: none; padding: 15px 32px; border-radius: 999px; transition: background .2s ease; }
.st-cta:hover { background: #EB6BA8; }

/* checkout / pay / placed */
.co { padding: 130px clamp(18px, 4vw, 56px) 90px; max-width: 760px; margin: 0 auto; }
.eyebrow { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: #9A9A9A; }
.co-form { display: flex; flex-direction: column; gap: 20px; margin-top: 36px; }
.field { display: flex; flex-direction: column; gap: 8px; }
.field .lab { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: #9A9A9A; }
.field input { font-size: 15px; color: #ffffff; background: transparent; border: 1px solid rgba(255,255,255,.25); padding: 13px 15px; outline: none; }
.radio-group { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
.radio-row { display: flex; align-items: center; gap: 14px; text-align: left; cursor: pointer; background: transparent; border: 1px solid rgba(255,255,255,.18); padding: 14px 16px; transition: border-color .2s ease; }
.radio-row:hover { border-color: #ffffff; }
.radio-row.sel { border-color: rgba(255,255,255,.85); }
.radio-row.off { opacity: .45; cursor: default; }
.radio-row.off:hover { border-color: rgba(255,255,255,.18); }
.radio-dot { width: 14px; height: 14px; border-radius: 50%; flex: none; border: 1px solid rgba(255,255,255,.3); background: transparent; }
.radio-row.sel .radio-dot { border-color: #ffffff; background: #ffffff; }
.radio-lab { font-size: 14.5px; color: #ffffff; }
.radio-note { font-size: 12px; color: #9A9A9A; }
.totals { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; border-top: 1px solid rgba(255,255,255,.18); padding-top: 20px; }
.trow { display: flex; justify-content: space-between; font-size: 14px; color: #9A9A9A; }
.trow.grand { color: #ffffff; }
.trow .v { font-variant-numeric: tabular-nums; }
.pay-btn { font-size: 15px; font-weight: 500; cursor: pointer; color: #000000; background: #ffffff; border: none; padding: 17px 0; border-radius: 999px; margin-top: 8px; transition: background .2s ease; }
.pay-btn:hover { background: #EB6BA8; }
.co-err { font-size: 13px; color: #EB6BA8; min-height: 18px; }
.hp { position: absolute; left: -9999px; opacity: 0; height: 0; width: 0; pointer-events: none; }

/* pay screen */
.pay-panel { border: 1px solid rgba(255,255,255,.18); padding: 28px; display: flex; flex-direction: column; align-items: center; gap: 16px; margin-top: 28px; }
.pay-amt { font-size: clamp(26px, 4vw, 40px); font-weight: 600; letter-spacing: -.03em; }
.pay-panel img { width: 200px; height: 200px; background: #ffffff; }
.upi-btn { display: inline-block; font-size: 14px; font-weight: 500; color: #000000; background: #ffffff; border: none; padding: 13px 30px; border-radius: 999px; transition: background .2s ease; cursor: pointer; }
.upi-btn:hover { background: #EB6BA8; color: #000000; }
.ghost-btn { font-size: 14px; color: #9A9A9A; background: transparent; border: none; cursor: pointer; padding: 12px 0; transition: color .2s ease; }
.ghost-btn:hover { color: #ffffff; }

/* placed */
.placed { text-align: center; padding: 60px 0; }
.placed h2 { font-size: clamp(26px, 4vw, 40px); font-weight: 600; letter-spacing: -.03em; margin: 16px 0 0; }
.placed .note { font-size: 14.5px; line-height: 1.65; color: #9A9A9A; margin: 16px auto 0; max-width: 48ch; text-wrap: pretty; }
.placed .sub { font-size: 12px; color: #555555; margin: 12px auto 0; max-width: 48ch; }
.placed .row { display: flex; gap: 12px; justify-content: center; margin-top: 34px; }
.placed .back-btn { font-size: 14px; font-weight: 500; cursor: pointer; color: #000000; background: #ffffff; border: none; padding: 14px 28px; border-radius: 999px; transition: background .2s ease; }
.placed .back-btn:hover { background: #EB6BA8; }

/* fallback (order server unreachable) */
.fb { border: 1px solid rgba(255,255,255,.18); padding: 26px; margin-top: 28px; display: flex; flex-direction: column; gap: 16px; }
.fb p { font-size: 14px; line-height: 1.65; color: #9A9A9A; margin: 0; }
.fb-sum { font-size: 13px; color: #ffffff; line-height: 1.7; }
.fb-btn { display: block; text-align: center; font-size: 14.5px; font-weight: 500; color: #000000; background: #ffffff; border: none; padding: 15px 0; border-radius: 999px; transition: background .2s ease; cursor: pointer; }
.fb-btn:hover { background: #EB6BA8; color: #000000; }
.fb-btn.ghost { background: transparent; color: #9A9A9A; }
.fb-btn.ghost:hover { color: #ffffff; background: transparent; }

/* cart drawer */
.cart-back { position: fixed; inset: 0; z-index: 80; background: rgba(0,0,0,.55); animation: fadeIn .2s ease both; }
.cart-panel { position: absolute; top: 0; right: 0; bottom: 0; width: min(520px, 100vw); background: #000000; border-left: 1px solid rgba(255,255,255,.16); display: flex; flex-direction: column; padding: 30px clamp(20px, 3vw, 40px); animation: slideIn .35s cubic-bezier(.16,1,.3,1) both; }
.cart-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.cart-title { font-size: 15px; letter-spacing: .1em; text-transform: uppercase; }
.cart-x { width: 36px; height: 36px; display: grid; place-items: center; font-size: 15px; color: #ffffff; background: transparent; border: none; cursor: pointer; }
.cart-x:hover { color: #EB6BA8; }
.cart-body { flex: 1; overflow: auto; margin-top: 34px; display: flex; flex-direction: column; gap: 28px; }
.cart-empty { margin: auto; text-align: center; }
.cart-empty .t { font-size: 14px; letter-spacing: .06em; text-transform: uppercase; margin: 0; }
.cart-empty .s { font-size: 13px; color: #9A9A9A; margin: 10px 0 0; }
.cart-empty .fix { margin-top: 22px; font-size: 13px; font-weight: 500; cursor: pointer; color: #000000; background: #ffffff; border: none; padding: 12px 24px; border-radius: 999px; transition: background .2s ease; }
.cart-empty .fix:hover { background: #EB6BA8; }
.c-row { display: flex; gap: 18px; align-items: flex-start; }
.c-thumb { position: relative; width: 74px; height: 74px; flex: none; overflow: hidden; }
.c-thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.c-thumb .print { text-shadow: none; }
.c-mid { flex: 1; display: flex; flex-direction: column; gap: 12px; }
.c-name { font-size: 13.5px; letter-spacing: .06em; text-transform: uppercase; }
.c-meta { font-size: 12px; color: #9A9A9A; }
.stepper { display: inline-flex; align-items: center; border: 1px solid rgba(255,255,255,.35); width: fit-content; }
.stepper button { width: 32px; height: 30px; font-size: 14px; color: #ffffff; background: transparent; border: none; cursor: pointer; }
.stepper button:hover { background: rgba(255,255,255,.12); }
.stepper .n { min-width: 34px; text-align: center; font-size: 13.5px; }
.c-line { font-size: 14px; color: #ffffff; font-variant-numeric: tabular-nums; }
.cart-foot { margin-top: 20px; }
.sub-row { display: flex; justify-content: space-between; font-size: 14.5px; letter-spacing: .06em; text-transform: uppercase; padding: 18px 0; border-top: 1px solid rgba(255,255,255,.18); }
.sub-row .v { font-variant-numeric: tabular-nums; }
.ship-joke { font-size: 12px; color: #9A9A9A; margin: 0 0 16px; }
.co-btn { width: 100%; font-size: 15px; font-weight: 500; cursor: pointer; color: #000000; background: #ffffff; border: none; padding: 17px 0; border-radius: 999px; transition: background .2s ease; }
.co-btn:hover { background: #EB6BA8; }

/* toast */
.toast { position: fixed; left: 50%; bottom: 26px; z-index: 90; transform: translateX(-50%); padding: 12px 22px; border-radius: 999px; background: #EB6BA8; color: #070707; font-size: 13px; font-weight: 500; white-space: nowrap; box-shadow: 0 18px 40px rgba(0,0,0,.5); animation: screenIn .3s cubic-bezier(.34,1.56,.64,1) both; }

/* self-order pill */
.self-pill { display: none; font-size: 10.5px; font-weight: 600; letter-spacing: .1em; color: #070707; background: #ECE42E; border-radius: 999px; padding: 4px 10px; }
body.self .self-pill { display: inline-block; }

/* footer fine print */
.fine { padding: 40px clamp(18px, 4vw, 56px) 60px; color: #555555; font-size: 12px; line-height: 1.7; max-width: 78ch; margin: 0 auto; text-align: center; }
.fine a { color: #9A9A9A; }

/* noscript */
.noscript-panel { margin: 140px auto 80px; max-width: 60ch; padding: 26px; border: 1px solid rgba(255,255,255,.18); font-size: 14px; line-height: 1.7; color: #9A9A9A; }
.noscript-panel b { color: #ffffff; }

/* re-renders of an already-open surface must not replay entry animations
   (the prototype keeps DOM nodes alive; innerHTML re-render would restart
   fadeIn/screenIn/slideIn and blank the page for a beat) */
.screen.noanim, .detail.noanim, .detail.noanim .d-info,
.cart-back.noanim, .cart-back.noanim .cart-panel,
.pop-back.noanim, .pop-back.noanim .pop-win { animation: none; }

/* ===== mobile (≤820px — adaptation; design is desktop-first) ===== */
@media (max-width: 820px) {
  .shop { flex-direction: column; padding-top: 104px; gap: 26px; }
  .side { position: static; width: 100%; flex-direction: row; align-items: center; gap: 18px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; }
  .side::-webkit-scrollbar { display: none; }
  .side-link { flex: none; }
  .side-gap { display: none; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
  .arch { padding-top: 104px; }
  .arch-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  .d-grid { grid-template-columns: 1fr; min-height: 0; }
  .d-stage { border-right: none; border-bottom: 1px solid rgba(255,255,255,.12); padding: 84px 20px 40px; }
  .d-info { padding: 40px clamp(18px, 5vw, 32px) 60px; }
  .studio { padding-top: 104px; }
  .st-grid { grid-template-columns: 1fr; }
  .co { padding-top: 104px; }
  .nav-right { gap: 14px; }
  .brand { font-size: 17px; }
  .nav-link { font-size: 13.5px; }
}

/* ===== reduced motion: static front shot + print stays readable ===== */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
}
</style>
